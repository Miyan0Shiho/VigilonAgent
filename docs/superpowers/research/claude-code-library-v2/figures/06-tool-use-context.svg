<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 06: ToolUseContext Structure</text>
  
  <!-- Context Object -->
  <rect x="100" y="80" width="600" height="350" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="120" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold">ToolUseContext</text>
  
  <!-- Fields -->
  <g transform="translate(130, 140)">
    <rect x="0" y="0" width="250" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="10" y="25" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">options</text>
    <text x="10" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12">tools, mainLoopModel, agentDefinitions</text>
  </g>
  
  <g transform="translate(420, 140)">
    <rect x="0" y="0" width="250" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="10" y="25" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">readFileState</text>
    <text x="10" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12">Map&lt;filePath, contentHash&gt;</text>
  </g>
  
  <g transform="translate(130, 230)">
    <rect x="0" y="0" width="250" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="10" y="25" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">agentId</text>
    <text x="10" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12">string | undefined (Subagent Scope)</text>
  </g>
  
  <g transform="translate(420, 230)">
    <rect x="0" y="0" width="250" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="10" y="25" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">queryTracking</text>
    <text x="10" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12">chainId, depth (Analytics)</text>
  </g>
  
  <g transform="translate(130, 320)">
    <rect x="0" y="0" width="250" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="10" y="25" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">abortController</text>
    <text x="10" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12">Signal for turn-level interruption</text>
  </g>
  
  <g transform="translate(420, 320)">
    <rect x="0" y="0" width="250" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="10" y="25" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">getAppState()</text>
    <text x="10" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12">Access to global UI/MCP state</text>
  </g>
</svg>

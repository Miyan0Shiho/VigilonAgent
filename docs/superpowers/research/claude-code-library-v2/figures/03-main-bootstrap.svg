<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 03: Bootstrap Sequence (main.tsx)</text>
  
  <!-- Entrypoint -->
  <rect x="300" y="60" width="200" height="40" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="85" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">cliMain() [main.tsx]</text>
  
  <line x1="400" y1="100" x2="400" y2="140" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Step 1: Config & Sinks -->
  <rect x="250" y="140" width="300" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="400" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">enableConfigs() / initSinks()</text>
  <text x="400" y="185" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">Load config, auth, and analytics</text>
  
  <line x1="400" y1="200" x2="400" y2="240" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: QueryEngine Init -->
  <rect x="250" y="240" width="300" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="400" y="265" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">new QueryEngine()</text>
  <text x="400" y="285" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">Initialize model, tools, and session</text>
  
  <line x1="400" y1="300" x2="400" y2="340" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Start Session -->
  <rect x="250" y="340" width="300" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="365" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">engine.startSession()</text>
  <text x="400" y="385" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">Mount Ink TUI / REPL</text>
  
  <line x1="400" y1="400" x2="400" y2="440" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- End -->
  <rect x="350" y="440" width="100" height="30" rx="15" fill="#000000"/>
  <text x="400" y="460" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">READY</text>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>

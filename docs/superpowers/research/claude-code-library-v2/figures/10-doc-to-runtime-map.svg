<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 10: Doc-to-Runtime Knowledge Map</text>
  
  <!-- Documentation Layers -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="180" height="350" rx="5" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5"/>
    <text x="90" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Doc Volumes (V2)</text>
    <text x="20" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12">Product layer</text>
    <text x="20" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12">Architecture layer</text>
    <text x="20" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12">User layer</text>
    <text x="20" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12">Implementation layer</text>
    <text x="20" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12">Mechanism layer</text>
    <text x="20" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12">Evidence layer</text>
  </g>
  
  <!-- Runtime Components -->
  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="180" height="350" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="90" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Runtime Symbols</text>
    <text x="20" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12">cli.tsx / main.tsx</text>
    <text x="20" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12">QueryEngine.ts</text>
    <text x="20" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12">query.ts (loop)</text>
    <text x="20" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12">Tool.ts (context)</text>
    <text x="20" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12">mcp/ / skills/</text>
    <text x="20" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12">sessionStorage.ts</text>
  </g>
  
  <!-- Mappings -->
  <line x1="280" y1="180" x2="520" y2="180" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="400" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">Evidence Linking</text>
  
  <path d="M 280 150 C 350 150, 450 110, 520 110" fill="none" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>
  <path d="M 280 210 C 350 210, 450 250, 520 250" fill="none" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 09: User Roles &amp; Capabilities</text>
  
  <!-- Terminal User -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="180" height="200" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="90" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Terminal User</text>
    <text x="10" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12">- Interactive REPL</text>
    <text x="10" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12">- Code Refactoring</text>
    <text x="10" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12">- Local Shell Access</text>
  </g>
  
  <!-- Team Admin -->
  <g transform="translate(310, 100)">
    <rect x="0" y="0" width="180" height="200" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="90" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Team / Ent Admin</text>
    <text x="10" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12">- Policy Enforcement</text>
    <text x="10" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12">- Usage Guardrails</text>
    <text x="10" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12">- Budgeting Control</text>
  </g>
  
  <!-- Extension Developer -->
  <g transform="translate(520, 100)">
    <rect x="0" y="0" width="180" height="200" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="90" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Extension Dev</text>
    <text x="10" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12">- MCP Integration</text>
    <text x="10" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12">- Custom Skills</text>
    <text x="10" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12">- Hook Development</text>
  </g>
</svg>

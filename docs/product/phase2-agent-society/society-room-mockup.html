<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigilon Agent Society — 数字工作社会</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1c1814;
  --text: #c8c0b8;
  --text-dim: #706860;
  --gold: #c89840;
  --surface: rgba(28,24,18,0.94);
  --surface-card: rgba(32,28,22,0.95);
  --border: rgba(255,255,255,0.06);
  --radius: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  color: var(--text);
}

.app {
  display: grid;
  grid-template-rows: 1fr 40px;
  grid-template-columns: 1fr 290px;
  grid-template-areas: "room sidebar" "chat chat";
  height: 100vh;
  gap: 1px;
  background: #1a1612;
}

/* ── Room ───────────────────────────────── */
.room-area {
  grid-area: room;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
#room-canvas {
  display: block;
  border-radius: 4px;
}

/* ── Sidebar ────────────────────────────── */
.sidebar {
  grid-area: sidebar;
  background: #141210;
  display: flex; flex-direction: column;
  border-left: 1px solid var(--border);
  overflow: hidden;
}

.sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.sidebar-header .dot { width: 5px; height: 5px; border-radius: 50%; background: #58a870; }
.sidebar-header .dot.warn { background: #d09040; }
.sidebar-title {
  font-family: 'Space Mono', monospace;
  font-size: 11px; color: #908878; letter-spacing: 1px;
}

/* Scenario buttons in sidebar */
.scenario-row {
  display: flex; gap: 4px; padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.scenario-btn {
  flex: 1;
  padding: 5px 0;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02);
  color: #888; font-size: 11px;
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  cursor: pointer; transition: all 0.2s;
  text-align: center;
}
.scenario-btn:hover { border-color: rgba(200,152,64,0.4); color: #baa880; }
.scenario-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(200,152,64,0.06); }

/* Agent detail section */
.detail-section {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.detail-empty-state {
  color: #605850; font-size: 12px;
  text-align: center; padding: 24px 0;
  line-height: 1.8;
}
.detail-empty-state .hint-icon { font-size: 20px; display: block; margin-bottom: 6px; opacity: 0.3; }

.detail-block {}
.detail-block-title {
  font-size: 9px; color: #605848;
  text-transform: uppercase; letter-spacing: 1.5px;
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.detail-block-text {
  font-size: 12px; line-height: 1.65; color: #b0a8a0;
}
.detail-block-text .ok { color: #78b888; }
.detail-block-text .warn { color: #d09060; }

/* Agent summary cards (when none selected) */
.agent-summary {
  display: flex; flex-direction: column; gap: 8px;
}
.agent-summary-card {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.04);
  cursor: pointer; transition: all 0.2s;
  font-size: 12px;
}
.agent-summary-card:hover { border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.02); }
.agent-summary-card .shape {
  width: 16px; height: 16px; flex-shrink: 0;
}
.agent-summary-card .shape.hex {
  background: #e87850; clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
}
.agent-summary-card .shape.diamond {
  background: #5098b8; transform: rotate(45deg); width: 12px; height: 12px; margin: 2px;
}
.agent-summary-card .shape.circle {
  background: #68a878; border-radius: 50%;
}
.agent-summary-card .info { flex: 1; min-width: 0; }
.agent-summary-card .info .name { font-weight: 500; color: #d0c8c0; }
.agent-summary-card .info .status { font-size: 10px; color: #706858; margin-top: 1px; }

/* Event timeline in sidebar */
.event-area {
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  max-height: 200px;
  overflow-y: auto;
  display: flex; flex-direction: column-reverse; gap: 3px;
}
.event-area-title {
  font-size: 9px; color: #605848;
  letter-spacing: 1.5px;
  margin-bottom: 6px;
}
.event-item {
  font-size: 11px; line-height: 1.5; color: #908878;
  animation: event-in 0.4s ease-out;
  padding: 2px 0;
}
@keyframes event-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.event-item .red { color: #e08870; }
.event-item .grn { color: #88c088; }
.event-item .dim { color: #706860; }

/* ── Chat bar ───────────────────────────── */
.chat-bar {
  grid-area: chat;
  background: #141210;
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px; gap: 10px;
}
.chat-bar input {
  flex: 1;
  background: transparent; border: none;
  color: #888; font-size: 12px;
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  outline: none;
}
.chat-bar input::placeholder { color: #444; }
.chat-bar .hint { font-size: 9px; color: #3a3a3a; font-family: 'Space Mono', monospace; white-space: nowrap; }

/* ── Toast (still overlay, on canvas) ───── */
.toast {
  position: fixed;
  top: 20px; left: 50%;
  transform: translateX(calc(-50% - 145px));
  background: rgba(32,28,22,0.96);
  border: 1px solid #d07060;
  border-radius: var(--radius);
  padding: 12px 18px;
  display: none;
  align-items: center; gap: 14px;
  z-index: 20;
  font-size: 13px; color: #d0c0b0;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px rgba(200,80,60,0.15);
  animation: toast-in 0.35s ease-out;
  pointer-events: all;
}
.toast.visible { display: flex; }
@keyframes toast-in {
  from { opacity: 0; transform: translateX(calc(-50% - 145px)) translateY(-6px); }
  to { opacity: 1; transform: translateX(calc(-50% - 145px)) translateY(0); }
}
.toast-actions { display: flex; gap: 8px; }
.toast-btn {
  padding: 6px 14px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(30,26,20,0.9);
  color: #c0b8a0; font-size: 12px;
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  cursor: pointer; transition: all 0.2s;
}
.toast-btn.allow { border-color: #78b878; color: #78b878; }
.toast-btn.allow:hover { background: rgba(120,184,120,0.08); }
.toast-btn.block { border-color: #d07060; color: #d07060; }
.toast-btn.block:hover { background: rgba(208,112,96,0.08); }

/* ── Help tip ──────────────────────────── */
.help-tip {
  position: fixed; bottom: 60px; left: 50%;
  transform: translateX(calc(-50% - 145px));
  font-size: 9px; color: rgba(255,255,255,0.14);
  text-align: center;
  z-index: 5; pointer-events: none;
  transition: opacity 1.5s;
}
</style>
</head>
<body>

<div class="app">
  <!-- Room -->
  <div class="room-area" id="room-area">
    <canvas id="room-canvas"></canvas>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="dot" id="status-dot"></span>
      <span class="sidebar-title">VIGILON 数字工作社会</span>
    </div>

    <div class="scenario-row">
      <button class="scenario-btn" data-sc="work">工作</button>
      <button class="scenario-btn" data-sc="dispute">争论</button>
      <button class="scenario-btn" data-sc="sleep">休息</button>
      <button class="scenario-btn" data-sc="wake">醒来</button>
    </div>

      <button class="scenario-btn" data-api="evolve" style="color:#78b878">推进</button>
    </div>

    <div class="detail-section" id="detail-section">
      <!-- Default: agent summary -->
      <div class="agent-summary" id="agent-summary">
        <div class="agent-summary-card" data-agent="agent-executor">
          <div class="shape hex"></div>
          <div class="info"><div class="name">执行者</div><div class="status">负责执行任务</div></div>
        </div>
        <div class="agent-summary-card" data-agent="agent-reviewer">
          <div class="shape diamond"></div>
          <div class="info"><div class="name">审查者</div><div class="status">负责质疑和审查</div></div>
        </div>
        <div class="agent-summary-card" data-agent="agent-guide">
          <div class="shape circle"></div>
          <div class="info"><div class="name">引导者</div><div class="status">关注用户能力和意图</div></div>
        </div>
        <div class="detail-empty-state" style="padding:12px 0">
          <span class="hint-icon">☝</span>点击左侧小人<br>或在上面选择 Agent<br>查看详细状态
        </div>
      </div>

      <!-- Selected agent detail (hidden by default) -->
      <div id="agent-detail" style="display:none;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:10px">
          <div id="detail-shape" style="width:20px;height:20px;flex-shrink:0"></div>
          <div>
            <div id="detail-name" style="font-weight:600;font-size:15px;color:#e0d8d0"></div>
            <div id="detail-role" style="font-size:10px;color:#706858"></div>
          </div>
          <button id="detail-back" style="margin-left:auto;background:none;border:1px solid rgba(255,255,255,0.08);color:#888;border-radius:4px;padding:4px 8px;font-size:10px;cursor:pointer;font-family:inherit">← 返回</button>
        </div>
        <div class="detail-block">
          <div class="detail-block-title">当前信念</div>
          <div class="detail-block-text" id="d-beliefs"></div>
        </div>
        <div class="detail-block">
          <div class="detail-block-title">记忆</div>
          <div class="detail-block-text" id="d-memory"></div>
        </div>
        <div class="detail-block">
          <div class="detail-block-title">声誉</div>
          <div class="detail-block-text" id="d-reputation"></div>
        </div>
        <div class="detail-block">
          <div class="detail-block-title">关系</div>
          <div class="detail-block-text" id="d-rels"></div>
        </div>
      </div>

      <!-- Scenario detail (hidden by default) -->
      <div id="scenario-detail" style="display:none;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:10px">
          <div id="sc-title" style="font-weight:600;font-size:14px;color:#e0d8d0"></div>
          <span style="font-size:9px;color:#605848;letter-spacing:1px" id="sc-source"></span>
        </div>
        <div id="sc-body"></div>
      </div>
    </div>

    <div class="event-area" id="event-area">
      <div class="event-area-title">社会事件</div>
      <div id="events-container"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-bar">
    <span style="font-size:12px;opacity:0.2">⟶</span>
    <input placeholder="向整个社会广播...">
    <span class="hint">radio · 非主界面</span>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span id="toast-msg"></span>
    <div class="toast-actions">
      <button class="toast-btn allow" id="toast-allow">放行</button>
      <button class="toast-btn block" id="toast-block">阻止</button>
    </div>
  </div>

  <!-- Help -->
  <div class="help-tip" id="help-tip">点击小人查看详情 · 观察他们工作、争论、休息</div>
</div>


<script>
// ═══════════════════════════════════════════════════════════════
// Vigilon Phase 2 — Agent Society Frontend
// Architecture: API Client → State Store → Renderers
// ═══════════════════════════════════════════════════════════════

// ── Canvas setup ────────────────────────────────────────────
const canvas = document.getElementById('room-canvas');
const ctx = canvas.getContext('2d');
const W = 1024, H = 640;
canvas.width = W; canvas.height = H;

function resize() {
  const area = document.getElementById('room-area');
  const scale = Math.min(area.clientWidth / W, area.clientHeight / H, 1.0);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ── Layout ───────────────────────────────────────────────────
const LAYOUT = {
  desks: [
    { x: 120, y: 140, w: 56, h: 34 },
    { x: 220, y: 90, w: 56, h: 34 },
    { x: 80, y: 270, w: 56, h: 34 },
    { x: 200, y: 220, w: 56, h: 34 },
  ],
  meetingTable: { x: 660, y: 180, rx: 75, ry: 48 },
  meetingChairs: [
    { x: 660, y: 122 }, { x: 720, y: 148 }, { x: 735, y: 198 },
    { x: 710, y: 240 }, { x: 630, y: 240 }, { x: 600, y: 198 },
    { x: 612, y: 148 },
  ],
  lounge: { x: 640, y: 400, w: 160, h: 100 },
  loungeSeats: [
    { x: 600, y: 385, w: 40, h: 24, angle: -0.3 },
    { x: 670, y: 376, w: 40, h: 24, angle: 0.15 },
    { x: 740, y: 394, w: 36, h: 22, angle: 0.4 },
  ],
  terminal: { x: 100, y: 520, w: 140, h: 50 },
  plants: [
    { x: 50, y: 60, r: 22 }, { x: 900, y: 60, r: 18 },
    { x: 940, y: 330, r: 24 }, { x: 60, y: 440, r: 18 },
    { x: 900, y: 510, r: 22 }, { x: 360, y: 70, r: 16 },
    { x: 560, y: 510, r: 20 },
  ],
  shelves: [
    { x: 380, y: 45, w: 180, h: 14 },
    { x: 600, y: 45, w: 120, h: 14 },
  ],
  rugWork: { x: 150, y: 180, rx: 150, ry: 110 },
  rugMeeting: { x: 660, y: 180, rx: 105, ry: 70 },
  rugLounge: { x: 640, y: 410, rx: 100, ry: 65 },
};

// ── Agent class (visual only — no hardcoded data) ───────────
class Agent {
  constructor(id, name, role, color, glowColor, shape, homeDeskIdx) {
    this.id = id; this.name = name; this.role = role;
    this.color = color; this.glowColor = glowColor; this.shape = shape;
    this.homeDesk = LAYOUT.desks[homeDeskIdx];
    this.x = this.homeDesk.x + this.homeDesk.w / 2;
    this.y = this.homeDesk.y + this.homeDesk.h / 2;
    this.targetX = this.x; this.targetY = this.y;
    this.disputing = false; this.resting = false; this.selected = false;
    this.bobOffset = Math.random() * 4;
    this.eyeDir = { x: 0, y: -1 };
    this.beliefs = []; this.memory = []; this.relationships = {};
  }

  walkTo(x, y) {
    this.targetX = x; this.targetY = y;
  }

  update(dt) {
    this.bobOffset += dt * 2;
    const dx = this.targetX - this.x, dy = this.targetY - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const speed = this.resting ? 50 : 130;
    if (dist > 2) {
      this.x += (dx / dist) * speed * dt;
      this.y += (dy / dist) * speed * dt;
      this.eyeDir = { x: dx / dist, y: dy / dist };
    }
  }

  syncFromState(fa) {
    this.name = fa.label;
    this.beliefs = fa.beliefs;
    this.memory = fa.memory;
    this.relationships = fa.relationships;
    this.disputing = fa.status === 'disputing';
    this.resting = fa.status === 'resting';
    // Smooth walk to target position
    if (Math.abs(this.targetX - fa.position.x) > 2 || Math.abs(this.targetY - fa.position.y) > 2) {
      this.walkTo(fa.position.x, fa.position.y);
    }
  }

  get statusText() {
    if (this.resting) return '休息中';
    if (this.disputing) return '争论中';
    return '工作中';
  }

  getRelLabel(targetId) {
    const val = this.relationships[targetId] || 50;
    if (val >= 75) return '信任';
    if (val >= 45) return '一般';
    return '紧张';
  }
}

// ── Create agents ────────────────────────────────────────────
const agents = [
  new Agent('agent-executor', '执行者', '负责执行任务', '#e87850', 'rgba(232,120,80,0.35)', 'hex', 0),
  new Agent('agent-reviewer', '审查者', '负责质疑和审查', '#5098b8', 'rgba(80,152,184,0.35)', 'diamond', 2),
  new Agent('agent-guide', '引导者', '关注用户能力和意图', '#68a878', 'rgba(104,168,120,0.35)', 'circle', 3),
];
const agentLabelMap = {};
agents.forEach(a => { agentLabelMap[a.id] = a.name; });

let selectedAgent = null;
let particles = [];
const events = [];

// ═══════════════════════════════════════════════════════════════
// Layer 1: API Client
// ═══════════════════════════════════════════════════════════════
const API = {
  async fetchState() {
    const res = await fetch('/api/state');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  },
  async cycle(phase) {
    const res = await fetch(`/api/cycle/${phase}`, { method: 'POST' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  },
  async toast(decision, disputeId) {
    const res = await fetch(`/api/toast/${decision}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ disputeId }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  },

  async evolve() {
    const res = await fetch('/api/evolve', { method: 'POST' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  },
};

// ═══════════════════════════════════════════════════════════════
// Layer 2: State Store
// ═══════════════════════════════════════════════════════════════
const Store = {
  state: null,
  _polling: false,
  _interval: null,

  setState(newState) {
    this.state = newState;
    // Sync agent data
    for (const fa of newState.agents) {
      const a = agents.find(ag => ag.id === fa.id);
      if (a) a.syncFromState(fa);
    }
    // Render
    SidebarRenderer.render(newState);
    ToastController.render(newState);
    updateEventsFromState(newState.events);
  },

  async poll() {
    if (this._polling) return;
    this._polling = true;
    try {
      const s = await API.fetchState();
      this.setState(s);
      document.getElementById('status-dot').classList.toggle('warn', s.phase === 'dispute');
    } catch (err) {
      console.error('[Store] poll failed:', err);
    }
    this._polling = false;
  },

  startPolling(intervalMs = 2000) {
    this.poll();
    this._interval = setInterval(() => this.poll(), intervalMs);
  },

  async triggerPhase(phase) {
    try {
      const s = await API.cycle(phase);
      this.setState(s);
      document.getElementById('status-dot').classList.toggle('warn', s.phase === 'dispute');
    } catch (err) {
      console.error('[Store] triggerPhase failed:', err);
    }
  },

  async resolveToast(decision) {
    const disputeId = this.state?.activeMediation?.disputeId;
    if (!disputeId) return;
    try {
      const s = await API.toast(decision, disputeId);
      this.setState(s);
      document.getElementById('toast').classList.remove('visible');
    } catch (err) {
      console.error('[Store] resolveToast failed:', err);
    }
  },

  async triggerBehavior(api) {
    try {
      const s = await API[api]();
      this.setState(s);
    } catch (err) {
      console.error('[Store] triggerBehavior failed:', err);
    }
  },
};

// ═══════════════════════════════════════════════════════════════
// Layer 3: Sidebar Renderer
// ═══════════════════════════════════════════════════════════════
const SidebarRenderer = {
  render(state) {
    if (selectedAgent) {
      this._renderAgentDetail(state);
    } else {
      this._renderScenario(state);
    }
    this._renderAgentSummaries(state);
  },

  _renderScenario(state) {
    if (!state) return;
    document.getElementById('agent-summary').style.display = 'none';
    document.getElementById('agent-detail').style.display = 'none';
    const el = document.getElementById('scenario-detail');
    if (!el) return;
    el.style.display = 'flex';

    const title = document.getElementById('sc-title');
    const body = document.getElementById('sc-body');
    if (!title || !body) return;

    switch (state.phase) {
      case 'work': {
        title.textContent = '📋 工作状态';
        body.innerHTML = `<div class="detail-block"><div class="detail-block-title">信任网络</div><div class="detail-block-text">${this._renderTrust(state)}</div></div>
          <div class="detail-block"><div class="detail-block-title">事件 (${state.events.length})</div><div class="detail-block-text">${state.events.slice(-3).map(e => `· ${e.summary.slice(0, 60)}`).join('<br>')}</div></div>`;
        break;
      }
      case 'dispute': {
        const med = state.activeMediation;
        title.textContent = med ? '⚡ 需用户裁决' : '⚡ 争议中';
        body.innerHTML = med
          ? `<div class="detail-block"><div class="detail-block-title">风险: ${med.risk}</div><div class="detail-block-text"><span class="warn">${med.challengerId}: ${med.challengerPosition}</span><br>${med.defenderId}: ${med.defenderPosition}</div></div>`
          : `<div class="detail-block"><div class="detail-block-title">状态</div><div class="detail-block-text"><span class="ok">Agent 正在协商解决</span></div></div>`;
        break;
      }
      case 'sleep': {
        const ls = state.lastSleep;
        const dr = ls?.dream ?? {};
        title.textContent = '💤 Dream 整理';
        const parts = [];
        if (dr.cleaned?.length) parts.push(`<div class="detail-block"><div class="detail-block-title">清理 (${dr.cleaned.length})</div><div class="detail-block-text">${dr.cleaned.map(c => `· ${(c.content ?? '').slice(0, 60)}<br><span class="dim">  ${c.reason}</span>`).join('<br>')}</div></div>`);
        if (dr.updated?.length) parts.push(`<div class="detail-block"><div class="detail-block-title">更新 (${dr.updated.length})</div><div class="detail-block-text">${dr.updated.map(u => `· ${(u.oldContent ?? '').slice(0, 40)} → ${(u.newContent ?? '').slice(0, 40)}<br><span class="dim">  ${u.reason}</span>`).join('<br>')}</div></div>`);
        if (dr.merged?.length) parts.push(`<div class="detail-block"><div class="detail-block-title">合并 (${dr.merged.length})</div><div class="detail-block-text">${dr.merged.map(m => `· ${(m.into ?? '').slice(0, 60)}<br><span class="dim">  ${m.reason}</span>`).join('<br>')}</div></div>`);
        if (dr.crossAnalysis?.length) parts.push(`<div class="detail-block"><div class="detail-block-title">洞察 (${dr.crossAnalysis.length})</div><div class="detail-block-text">${dr.crossAnalysis.map(c => `· <span class="ok">${c.pattern}</span><br><span class="dim">  ${(c.insight ?? '').slice(0, 80)}</span>`).join('<br>')}</div></div>`);
        body.innerHTML = parts.join('') || '<div class="detail-block-text">无变化</div>';
        break;
      }
      case 'wake': {
        const lw = state.lastWake;
        title.textContent = '🌅 醒来';
        const parts = [];
        if (lw?.identity) parts.push(`<div class="detail-block"><div class="detail-block-title">身份</div><div class="detail-block-text"><span class="${lw.identity.stillSameAgent ? 'ok' : 'warn'}">${lw.identity.stillSameAgent ? '同一 Agent ✅' : '变化 ⚠️'}</span></div></div>`);
        if (lw?.constraints?.length) parts.push(`<div class="detail-block"><div class="detail-block-title">约束 (${lw.constraints.length})</div><div class="detail-block-text">${lw.constraints.map(c => `· <span class="warn">${(typeof c === 'string' ? c : '').slice(0, 80)}</span>`).join('<br>')}</div></div>`);
        if (lw?.skillsRules) {
          const sr = lw.skillsRules;
          if (sr.newSkills?.length) parts.push(`<div class="detail-block"><div class="detail-block-title">新技能</div><div class="detail-block-text">${sr.newSkills.map(s => `· <span class="ok">${s.name}</span> (${((s.confidence ?? 0) * 100).toFixed(0)}%)`).join('<br>')}</div></div>`);
          if (sr.newRules?.length) parts.push(`<div class="detail-block"><div class="detail-block-title">新规则</div><div class="detail-block-text">${sr.newRules.map(r => `· <span class="warn">[${r.type}] ${(r.rule ?? '').slice(0, 60)}</span>`).join('<br>')}</div></div>`);
        }
        body.innerHTML = parts.join('') || '<div class="detail-block-text">无数据</div>';
        break;
      }
    }
  },

  _renderAgentDetail(state) {
    document.getElementById('agent-summary').style.display = 'none';
    document.getElementById('scenario-detail').style.display = 'none';
    const detail = document.getElementById('agent-detail');
    detail.style.display = 'flex';

    const a = selectedAgent;
    const fa = state.agents.find(ag => ag.id === a.id);
    if (!fa) return;

    document.getElementById('d-beliefs').innerHTML = fa.beliefs.map(b =>
      `<span class="${b.status === 'warn' ? 'warn' : 'ok'}">${b.text.slice(0, 80)}</span> · ${b.note.slice(0, 40)}`
    ).join('<br>') || '<span class="dim">无信念数据</span>';

    document.getElementById('d-memory').innerHTML = fa.memory.map(m =>
      `"${m.text.slice(0, 60)}" <span class="ok">[${m.source}]</span>`
    ).join('<br>') || '<span class="dim">无记忆数据</span>';

    // Reputation bars
    const rep = fa.reputation ?? {};
    const repDims = ['competence', 'reliability', 'cooperativeness', 'integrity', 'knowledge'];
    const repLabels = { competence: '能力', reliability: '可靠', cooperativeness: '合作', integrity: '诚信', knowledge: '知识' };
    document.getElementById('d-reputation').innerHTML = repDims.map(d => {
      const v = rep[d] ?? 50;
      const cls = v >= 65 ? 'ok' : v >= 45 ? '' : 'warn';
      const bar = '█'.repeat(Math.round(v / 10)) + '░'.repeat(10 - Math.round(v / 10));
      return `<span class="${cls}">${repLabels[d]}</span> <span class="dim">${bar} ${v}%</span>`;
    }).join('<br>');

    document.getElementById('d-rels').innerHTML = Object.entries(fa.relationships).map(([k, v]) => {
      const cls = v >= 70 ? 'ok' : v >= 45 ? '' : 'warn';
      return `→${agentLabelMap[k] ?? k}: <span class="${cls}">${v}%（${a.getRelLabel(k)}）</span>`;
    }).join('<br>') || '<span class="dim">无关系数据</span>';
  },

  _renderAgentSummaries(state) {
    document.querySelectorAll('.agent-summary-card .info .status').forEach(el => {
      const agentId = el.closest('.agent-summary-card').dataset.agent;
      const fa = state.agents.find(ag => ag.id === agentId);
      if (fa) {
        const rels = fa.relationships;
        el.textContent = Object.keys(rels).length > 0
          ? Object.entries(rels).map(([k, v]) => `${agentLabelMap[k] ?? k}:${v}%`).join(' ')
          : '工作中';
      }
    });
  },

  _renderTrust(state) {
    const t = state.trustGraph;
    if (!t || Object.keys(t).length === 0) return '无数据';
    return Object.entries(t).map(([from, targets]) =>
      Object.entries(targets).filter(([to]) => to !== from).map(([to, v]) => {
        const cls = v >= 70 ? 'ok' : v >= 45 ? '' : 'warn';
        return `<span class="${cls}">${agentLabelMap[from] ?? from}→${agentLabelMap[to] ?? to}: ${v}%</span>`;
      }).join('<br>')
    ).join('<br>');
  },
};

// Event timeline
// ═══════════════════════════════════════════════════════════════
function addEvent(cls, text) {
  events.unshift({ cls, text });
  if (events.length > 20) events.length = 20;
  updateEventsDOM();
}

function updateEventsDOM() {
  const el = document.getElementById('events-container');
  el.innerHTML = events.slice(0, 10).map(e =>
    `<div class="event-item"><span class="${e.cls}">${e.text}</span></div>`
  ).join('');
}

function updateEventsFromState(serverEvents) {
  // Deduplicate and add server events to local timeline
  const existing = new Set(events.map(e => e.text));
  for (const se of (serverEvents ?? []).slice(-8)) {
    if (!existing.has(se.summary)) {
      const cls = se.phase === 'dispute' ? 'red' : se.phase === 'sleep' ? 'dim' : 'grn';
      events.unshift({ cls, text: se.summary });
    }
  }
  if (events.length > 20) events.length = 20;
  updateEventsDOM();
}

function selectAgent(a) {
  agents.forEach(ag => ag.selected = false);
  a.selected = true; selectedAgent = a;

  // Shape icon
  const shapeEl = document.getElementById('detail-shape');
  shapeEl.className = ''; shapeEl.style.cssText = '';
  if (a.shape === 'hex') {
    shapeEl.style.width = '20px'; shapeEl.style.height = '20px';
    shapeEl.style.background = a.color;
    shapeEl.style.clipPath = 'polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)';
  } else if (a.shape === 'diamond') {
    shapeEl.style.width = '16px'; shapeEl.style.height = '16px';
    shapeEl.style.background = a.color;
    shapeEl.style.transform = 'rotate(45deg)';
  } else {
    shapeEl.style.width = '18px'; shapeEl.style.height = '18px';
    shapeEl.style.background = a.color;
    shapeEl.style.borderRadius = '50%';
  }

  document.getElementById('detail-name').textContent = a.name;
  document.getElementById('detail-role').textContent = Store.state?.agents.find(ag => ag.id === a.id)?.roles?.length
    ? Store.state.agents.find(ag => ag.id === a.id).roles.join(' · ')
    : a.role;

  if (Store.state) SidebarRenderer._renderAgentDetail(Store.state);
}

function deselectAgent() {
  agents.forEach(a => a.selected = false);
  selectedAgent = null;
  document.getElementById('agent-detail').style.display = 'none';
  document.getElementById('scenario-detail').style.display = 'none';
  document.getElementById('agent-summary').style.display = 'flex';
}

document.getElementById('detail-back').addEventListener('click', deselectAgent);

// Click agent summary cards
document.querySelectorAll('.agent-summary-card').forEach(card => {
  card.addEventListener('click', () => {
    const a = agents.find(ag => ag.id === card.dataset.agent);
    if (a) selectAgent(a);
  });
});

// Click on canvas
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = W / rect.width, sy = H / rect.height;
  const mx = (e.clientX - rect.left) * sx;
  const my = (e.clientY - rect.top) * sy;

  let clicked = null;
  for (let i = agents.length - 1; i >= 0; i--) {
    if (Math.hypot(mx - agents[i].x, my - agents[i].y) < 18) { clicked = agents[i]; break; }
  }
  clicked ? selectAgent(clicked) : deselectAgent();
});

// Scenario buttons → API calls
document.querySelectorAll('.scenario-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const phase = btn.dataset.sc;
    const api = btn.dataset.api;
    if (api) {
      document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Store.triggerBehavior(api);
    } else if (phase) {
      document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Store.triggerPhase(phase);
    }
  });
});

// ═══════════════════════════════════════════════════════════════
// Particles
// ═══════════════════════════════════════════════════════════════
function spawnParticles(x, y, count, color, spread) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * spread,
      vy: (Math.random() - 0.5) * spread - 8,
      life: 0.5 + Math.random() * 0.6,
      color, size: 1.5 + Math.random() * 2.5,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 12 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ═══════════════════════════════════════════════════════════════
// Canvas drawing (unchanged visual engine)
// ═══════════════════════════════════════════════════════════════
function roundRect(x, y, w, h, r) {
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.closePath();
}

function drawHexagon(x, y, r) {
  ctx.moveTo(x + r, y);
  for (let i = 1; i < 6; i++) {
    const a = (i * Math.PI) / 3;
    ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a));
  }
  ctx.closePath();
}

function drawFloor() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#d4b896'); grad.addColorStop(0.4, '#d0b490');
  grad.addColorStop(0.7, '#c8ac88'); grad.addColorStop(1, '#c0a480');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(0,0,0,0.035)'; ctx.lineWidth = 0.8;
  for (let y = 0; y < H; y += 16) {
    ctx.beginPath();
    ctx.moveTo(0, y + Math.sin(y * 0.02) * 3);
    ctx.lineTo(W, y + Math.cos(y * 0.015) * 3);
    ctx.stroke();
  }
  const light = ctx.createRadialGradient(400, 0, 0, 400, 200, 700);
  light.addColorStop(0, 'rgba(255,248,235,0.22)');
  light.addColorStop(0.4, 'rgba(255,240,220,0.06)');
  light.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = light; ctx.fillRect(0, 0, W, H);
  const sh = ctx.createRadialGradient(640, 430, 30, 640, 430, 180);
  sh.addColorStop(0, 'rgba(30,40,60,0.10)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh; ctx.fillRect(0, 0, W, H);
}

function drawRugs() {
  [{ rug: LAYOUT.rugWork, c: 'rgba(230,218,200,0.22)' },
   { rug: LAYOUT.rugMeeting, c: 'rgba(210,200,185,0.20)' },
   { rug: LAYOUT.rugLounge, c: 'rgba(180,190,200,0.16)' }].forEach(({rug, c}) => {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(rug.x, rug.y, rug.rx, rug.ry, 0.03, 0, Math.PI * 2); ctx.fill();
  });
}

function drawDesk(d) {
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.beginPath(); roundRect(d.x + 2, d.y + 3, d.w, d.h, 6); ctx.fill();
  const dg = ctx.createLinearGradient(d.x, d.y, d.x, d.y + d.h);
  dg.addColorStop(0, '#f0e8d8'); dg.addColorStop(0.3, '#ede4d0'); dg.addColorStop(1, '#d8ccb4');
  ctx.fillStyle = dg;
  ctx.beginPath(); roundRect(d.x, d.y, d.w, d.h, 6); ctx.fill();
  ctx.fillStyle = 'rgba(250,245,238,0.55)';
  ctx.beginPath(); roundRect(d.x + 2, d.y + 1, d.w - 4, d.h * 0.6, 4); ctx.fill();
  ctx.fillStyle = '#3a3a3e';
  ctx.beginPath(); roundRect(d.x + d.w / 2 - 10, d.y + 3, 20, 13, 3); ctx.fill();
  ctx.fillStyle = '#2a2d35';
  ctx.beginPath(); roundRect(d.x + d.w / 2 - 8, d.y + 5, 16, 9, 2); ctx.fill();
  const sleepActive = Store.state?.phase === 'sleep';
  if (!sleepActive) {
    ctx.fillStyle = 'rgba(180,200,220,0.10)';
    ctx.beginPath(); roundRect(d.x + d.w / 2 - 8, d.y + 5, 16, 9, 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); roundRect(d.x + d.w / 2 - 12, d.y + 19, 24, 7, 2); ctx.fill();
  if (d === LAYOUT.desks[0]) {
    ctx.fillStyle = '#c8b898'; ctx.beginPath();
    ctx.arc(d.x + d.w - 8, d.y + d.h - 10, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a3020'; ctx.beginPath();
    ctx.arc(d.x + d.w - 8, d.y + d.h - 10, 3, 0, Math.PI * 2); ctx.fill();
  }
}

function drawMeetingArea() {
  const mt = LAYOUT.meetingTable;
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.beginPath(); ctx.ellipse(mt.x + 3, mt.y + 4, mt.rx, mt.ry, 0, 0, Math.PI * 2); ctx.fill();
  const tg = ctx.createLinearGradient(mt.x - mt.rx, mt.y, mt.x + mt.rx, mt.y);
  tg.addColorStop(0, '#a08060'); tg.addColorStop(0.4, '#b89470');
  tg.addColorStop(0.6, '#b89470'); tg.addColorStop(1, '#9a7a58');
  ctx.fillStyle = tg;
  ctx.beginPath(); ctx.ellipse(mt.x, mt.y, mt.rx, mt.ry, 0, 0, Math.PI * 2); ctx.fill();
  LAYOUT.meetingChairs.forEach(ch => {
    ctx.fillStyle = 'rgba(60,60,68,0.65)';
    ctx.beginPath(); ctx.arc(ch.x, ch.y, 8, 0, Math.PI * 2); ctx.fill();
  });
  if (Store.state?.phase === 'dispute') {
    const pulse = 0.18 + Math.sin(Date.now() / 800) * 0.10;
    ctx.fillStyle = `rgba(220,100,80,${pulse})`;
    ctx.beginPath(); ctx.ellipse(mt.x, mt.y, mt.rx + 8, mt.ry + 6, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawLounge() {
  LAYOUT.loungeSeats.forEach(s => {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.angle);
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.beginPath(); roundRect(2, 3, s.w, s.h, 10); ctx.fill();
    const sg = ctx.createLinearGradient(0, 0, 0, s.h);
    sg.addColorStop(0, '#8898a8'); sg.addColorStop(1, '#6a7a88');
    ctx.fillStyle = sg;
    ctx.beginPath(); roundRect(0, 0, s.w, s.h, 10); ctx.fill();
    ctx.restore();
  });
  const l = LAYOUT.lounge;
  ctx.fillStyle = '#b89470'; ctx.beginPath();
  ctx.arc(l.x + l.w - 30, l.y + l.h - 30, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,160,0.10)'; ctx.beginPath();
  ctx.arc(l.x + l.w - 30, l.y + l.h - 30, 25, 0, Math.PI * 2); ctx.fill();
}

function drawPlants() {
  LAYOUT.plants.forEach(p => {
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath(); ctx.ellipse(p.x + 2, p.y + 2, p.r * 0.6, p.r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    const pg = ctx.createLinearGradient(p.x, p.y - p.r * 0.4, p.x, p.y + p.r * 0.4);
    pg.addColorStop(0, '#c89070'); pg.addColorStop(1, '#a07050');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.6, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2 + p.x * 0.1;
      const lx = p.x + Math.cos(angle) * p.r * 0.5;
      const ly = p.y - p.r * 0.3 + Math.sin(angle) * p.r * 0.3;
      ctx.fillStyle = `rgba(${80 + Math.random() * 40},${140 + Math.random() * 40},${70 + Math.random() * 40},0.65)`;
      ctx.beginPath(); ctx.arc(lx, ly, p.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
  });
}

function drawTerminal() {
  const t = LAYOUT.terminal;
  ctx.fillStyle = '#e8dcc8';
  ctx.beginPath(); roundRect(t.x, t.y, t.w, t.h, 8); ctx.fill();
  ctx.fillStyle = '#1a1d22';
  ctx.beginPath(); roundRect(t.x + 10, t.y - 18, t.w - 20, 20, 4); ctx.fill();
  const gp = 0.06 + Math.sin(Date.now() / 2000) * 0.03;
  ctx.fillStyle = `rgba(104,168,120,${gp})`;
  ctx.beginPath(); roundRect(t.x + 12, t.y - 16, t.w - 24, 16, 3); ctx.fill();
  ctx.fillStyle = 'rgba(200,220,200,0.4)';
  ctx.beginPath(); ctx.arc(t.x + t.w / 2, t.y - 12, 5, 0, Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(t.x + t.w / 2, t.y - 16, 3, 0, Math.PI * 2); ctx.fill();
}

function drawShelves() {
  LAYOUT.shelves.forEach(s => {
    ctx.fillStyle = '#c0a080';
    ctx.beginPath(); roundRect(s.x, s.y, s.w, s.h, 4); ctx.fill();
    for (let bx = s.x + 6; bx < s.x + s.w - 10; bx += 10 + Math.random() * 6) {
      const bw = 6 + Math.random() * 5, bh = 10 + Math.random() * 2;
      ctx.fillStyle = `hsl(${10 + Math.random() * 50}, 25%, ${38 + Math.random() * 18}%)`;
      ctx.fillRect(bx, s.y - bh + s.h, bw, bh);
    }
  });
}

function drawAgent(a) {
  ctx.save(); ctx.translate(a.x, a.y);
  const bob = a.disputing ? 0 : Math.sin(a.bobOffset) * 1.0;
  const isResting = a.resting;

  if (!isResting) {
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.beginPath(); ctx.ellipse(0, 4, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
  }

  if (a.selected) {
    ctx.fillStyle = 'rgba(200,152,64,0.22)';
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
  }

  if (isResting) {
    ctx.save(); ctx.scale(1.5, 0.6);
    drawAgentBody(a, true);
    ctx.restore();
  } else {
    ctx.translate(0, bob);
    drawAgentBody(a, false);
    drawAgentEyes(a);
  }

  // Data label from state
  if (Store.state && !isResting) {
    const fa = Store.state.agents.find(ag => ag.id === a.id);
    if (fa) {
      const entries = Object.entries(fa.relationships).filter(([, v]) => typeof v === 'number');
      if (entries.length > 0) {
        const label = entries.map(([k, v]) => `${agentLabelMap[k] ?? k} ${v}%`).join(' · ');
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.font = '9px "Noto Sans SC", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, 0, 14);
        ctx.fillStyle = 'rgba(200,152,64,0.50)';
        ctx.fillText(label, 0, 13);
      }
    }
  }

  ctx.restore();
}

function drawAgentBody(a, isResting) {
  const bodyColor = isResting ? '#3a3a40' : a.color;
  const glowColor = isResting ? 'rgba(255,255,255,0.03)' : a.glowColor;
  const sz = isResting ? 6 : 8;

  if (a.shape === 'hex') {
    ctx.fillStyle = bodyColor; ctx.beginPath(); drawHexagon(0, 0, sz); ctx.fill();
    if (!isResting) { ctx.fillStyle = glowColor; ctx.beginPath(); drawHexagon(0, 0, sz + 3); ctx.fill(); }
  } else if (a.shape === 'diamond') {
    ctx.save(); if (!isResting) ctx.rotate(Math.PI / 4);
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); roundRect(-sz + 2, -sz + 2, (sz - 2) * 2, (sz - 2) * 2, 2); ctx.fill();
    if (!isResting) { ctx.fillStyle = glowColor; ctx.beginPath(); roundRect(-sz, -sz, sz * 2 + 2, sz * 2 + 2, 3); ctx.fill(); }
    ctx.restore();
  } else {
    ctx.fillStyle = bodyColor; ctx.beginPath(); ctx.arc(0, 0, sz - 1, 0, Math.PI * 2); ctx.fill();
    if (!isResting) { ctx.fillStyle = glowColor; ctx.beginPath(); ctx.arc(0, 0, sz + 2, 0, Math.PI * 2); ctx.fill(); }
  }

  if (a.disputing && !isResting) {
    const pulse = 0.25 + Math.sin(Date.now() / 500) * 0.18;
    ctx.fillStyle = `rgba(220,100,80,${pulse})`;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
  }
}

function drawAgentEyes(a) {
  const ex = a.eyeDir.x * 2.5, ey = a.eyeDir.y * 2.5 - 1;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-2.5 + ex, -1 + ey, 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(2.5 + ex, -1 + ey, 1.3, 0, Math.PI * 2); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawFloor(); drawRugs();
  LAYOUT.desks.forEach(d => drawDesk(d));
  drawShelves(); drawMeetingArea(); drawLounge(); drawPlants(); drawTerminal();

  const sorted = [...agents].sort((a, b) => a.y - b.y);
  sorted.forEach(a => drawAgent(a));

  particles.forEach(p => {
    const alpha = Math.min(1, p.life / 0.6);
    ctx.fillStyle = p.color.replace('0.8)', `${alpha * 0.6})`).replace('0.35', `${alpha * 0.25}`);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2); ctx.fill();
  });

  // Dispute visual (red dashed line between challenger/defender)
  if (Store.state?.phase === 'dispute') {
    const [w, c] = [agents[0], agents[1]];
    const pulse = Math.sin(Date.now() / 700) * 0.4 + 0.6;
    ctx.strokeStyle = `rgba(220,120,100,${0.18 + pulse * 0.18})`;
    ctx.lineWidth = 1; ctx.setLineDash([3, 8]);
    ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(c.x, c.y);
    ctx.stroke(); ctx.setLineDash([]);
    if (Math.random() < 0.04) {
      spawnParticles((w.x + c.x) / 2, (w.y + c.y) / 2, 1, 'rgba(240,140,120,0.7)', 6);
    }
  }

  // Cooperation visual (green line between workers)
  if (Store.state?.events?.slice(-1)[0]?.summary?.startsWith('[合作]')) {
    const [a0, a2] = [agents[0], agents[2]];
    ctx.strokeStyle = 'rgba(120,184,120,0.25)';
    ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(a0.x, a0.y); ctx.lineTo(a2.x, a2.y);
    ctx.stroke();
    if (Math.random() < 0.06) {
      spawnParticles((a0.x + a2.x) / 2, (a0.y + a2.y) / 2, 2, 'rgba(120,200,120,0.5)', 4);
    }
  }

  // Consultation visual (blue line)
  if (Store.state?.events?.slice(-1)[0]?.summary?.startsWith('[咨询]')) {
    const [a0, a2] = [agents[0], agents[2]];
    ctx.strokeStyle = 'rgba(120,168,208,0.25)';
    ctx.lineWidth = 1; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(a0.x, a0.y); ctx.lineTo(a2.x, a2.y);
    ctx.stroke();
    ctx.setLineDash([]);
    if (Math.random() < 0.06) {
      spawnParticles((a0.x + a2.x) / 2, (a0.y + a2.y) / 2, 2, 'rgba(120,168,220,0.5)', 4);
    }
  }

  // Work visual (green dotted line between worker and guide)
  if (Store.state?.phase === 'work') {
    const [w, , s] = [agents[0], agents[1], agents[2]];
    ctx.strokeStyle = 'rgba(104,168,120,0.10)';
    ctx.lineWidth = 0.8; ctx.setLineDash([2, 10]);
    ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(s.x, s.y);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Data badge
  if (Store.state) {
    const badgeW = 160, badgeH = 20;
    ctx.fillStyle = 'rgba(20,16,12,0.82)';
    ctx.beginPath(); roundRect(W - badgeW - 10, 10, badgeW, badgeH, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(200,152,64,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath(); roundRect(W - badgeW - 10, 10, badgeW, badgeH, 4); ctx.stroke();
    ctx.fillStyle = '#c89840';
    ctx.font = '9px "Space Mono", monospace';
    ctx.textAlign = 'right';
    const src = Store.state.source === 'live' ? 'LIVE' : Store.state.source === 'workspace' ? 'WS' : 'DEMO';
    ctx.fillText(`${src} · phase:${Store.state.phase} · ${Store.state.events.length} events`, W - 16, 24);
  }
}

// ═══════════════════════════════════════════════════════════════
// Game loop
// ═══════════════════════════════════════════════════════════════
let lastTs = performance.now();
function loop(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.1);
  lastTs = ts;
  agents.forEach(a => a.update(dt));
  updateParticles(dt);
  draw();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════
addEvent('dim', 'Agent 社会启动 — 连接工作区...');

// Set sidebar title based on data source
document.querySelector('.sidebar-title').textContent = 'VIGILON · 连接中';

// Start polling, then init visual loop
Store.startPolling(2000);
// Update sidebar title after first poll
setTimeout(() => {
  if (Store.state) {
    const src = Store.state.source === 'live' ? '实时' : '工作区';
    document.querySelector('.sidebar-title').textContent = `VIGILON · ${src}`;
    addEvent('grn', `已连接 — 3 Agent · ${Store.state.events.length} 事件`);
  }
}, 2500);

updateEventsDOM();
resize();
requestAnimationFrame(loop);

setTimeout(() => {
  document.getElementById('help-tip').style.opacity = '0';
}, 8000);

console.log('🏢 Vigilon Agent Society — fetch-driven');
</script>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title { font: 700 22px "Inter","Helvetica Neue",Arial,sans-serif; fill:#111; }
      .sub { font: 400 13px "Inter","Helvetica Neue",Arial,sans-serif; fill:#555; }
      .h { font: 700 14px "Inter","Helvetica Neue",Arial,sans-serif; fill:#111; }
      .t { font: 400 12px "Inter","Helvetica Neue",Arial,sans-serif; fill:#222; }
      .muted { font: 400 11px "Inter","Helvetica Neue",Arial,sans-serif; fill:#666; }
      .box { fill:#fff; stroke:#111; stroke-width:1.1; rx:12; }
      .lite { fill:#fff; stroke:#777; stroke-width:1.0; rx:12; }
      .accent { fill:#1565c0; }
      .arrow { stroke:#111; stroke-width:1.2; fill:none; }
      .arrowHead { fill:#111; }
      .grid { stroke:#eee; stroke-width:1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowHead"/>
    </marker>
  </defs>

  <text x="40" y="52" class="title">交互与执行反馈闭环对比：输入 → 工具执行 → 进度/摘要 → 审批</text>
  <text x="40" y="78" class="sub">Claude Code（Ink/React + 权限 UI）· OpenClaw（TUI components + 状态摘要）· Hermes（curses + 插件注入 + 中断/压缩告警）</text>

  <line x1="40" y1="110" x2="1360" y2="110" class="grid"/>
  <line x1="467" y1="110" x2="467" y2="780" class="grid"/>
  <line x1="893" y1="110" x2="893" y2="780" class="grid"/>

  <rect x="40" y="120" width="407" height="44" class="lite"/>
  <rect x="467" y="120" width="426" height="44" class="lite"/>
  <rect x="893" y="120" width="467" height="44" class="lite"/>
  <rect x="55" y="133" width="10" height="18" class="accent" rx="3"/>
  <text x="75" y="149" class="h">Claude Code</text>
  <rect x="482" y="133" width="10" height="18" class="accent" rx="3"/>
  <text x="502" y="149" class="h">OpenClaw</text>
  <rect x="908" y="133" width="10" height="18" class="accent" rx="3"/>
  <text x="928" y="149" class="h">Hermes Agent</text>

  <!-- Shared stages -->
  <text x="40" y="230" class="h">① 输入/交互载体</text>
  <text x="40" y="370" class="h">② 工具执行反馈</text>
  <text x="40" y="510" class="h">③ 状态摘要/通知</text>
  <text x="40" y="650" class="h">④ 审批/中断/降级</text>

  <!-- Claude -->
  <rect x="70" y="200" width="347" height="110" class="box"/>
  <text x="90" y="226" class="t">Ink/React 主 UI：对话、输入、状态条</text>
  <text x="90" y="248" class="muted">main.tsx · components/*</text>
  <text x="90" y="270" class="muted">keybindings/*（可自定义+校验）</text>

  <rect x="70" y="340" width="347" height="110" class="box"/>
  <text x="90" y="366" class="t">工具进度事件类型化 → 进度组件渲染</text>
  <text x="90" y="388" class="muted">types/tools.ts · AgentProgressLine.tsx</text>

  <rect x="70" y="480" width="347" height="110" class="box"/>
  <text x="90" y="506" class="t">成本/预算/缓存 tokens 可观测</text>
  <text x="90" y="528" class="muted">cost-tracker.ts（save/restore + FPS）</text>

  <rect x="70" y="620" width="347" height="110" class="box"/>
  <text x="90" y="646" class="t">审批 UI 一等公民（权限弹窗/Plan gate）</text>
  <text x="90" y="668" class="muted">components/permissions/*</text>
  <text x="90" y="690" class="muted">终端能力探测/降级：supports-hyperlinks 等</text>

  <!-- OpenClaw -->
  <rect x="500" y="200" width="360" height="110" class="box"/>
  <text x="520" y="226" class="t">TUI：事件处理器 + 行为测试规格</text>
  <text x="520" y="248" class="muted">tui-event-handlers.ts + *.test.ts</text>

  <rect x="500" y="340" width="360" height="110" class="box"/>
  <text x="520" y="366" class="t">工具执行组件：preview 截断 + 运行/成功/失败三态</text>
  <text x="520" y="388" class="muted">ToolExecutionComponent（tool-execution.ts）</text>

  <rect x="500" y="480" width="360" height="110" class="box"/>
  <text x="520" y="506" class="t">状态摘要与通知策略：终态/进度/去重</text>
  <text x="520" y="528" class="muted">tui-status-summary.ts · task-executor-policy.ts</text>

  <rect x="500" y="620" width="360" height="110" class="box"/>
  <text x="520" y="646" class="t">onboarding：setup wizard（配置/密钥/插件）</text>
  <text x="520" y="668" class="muted">wizard/setup.ts</text>

  <!-- Hermes -->
  <rect x="930" y="200" width="400" height="110" class="box"/>
  <text x="950" y="226" class="t">CLI/TUI + Gateway：多入口统一对话</text>
  <text x="950" y="248" class="muted">pyproject scripts · hermes_cli/main.py</text>

  <rect x="930" y="340" width="400" height="110" class="box"/>
  <text x="950" y="366" class="t">执行反馈：并行工具日志/回调（可选）</text>
  <text x="950" y="388" class="muted">run_agent.py：_execute_tool_calls(_concurrent)</text>

  <rect x="930" y="480" width="400" height="110" class="box"/>
  <text x="950" y="506" class="t">压缩告警 + 去重重置（面向体验与正确性）</text>
  <text x="950" y="528" class="muted">run_agent.py：compression_count warn + reset_file_dedup</text>

  <rect x="930" y="620" width="400" height="110" class="box"/>
  <text x="950" y="646" class="t">curses checklist/radiolist + fallback + flush_stdin</text>
  <text x="950" y="668" class="muted">curses_ui.py（防输入污染/非 TTY 降级）</text>
  <text x="950" y="690" class="muted">插件注入消息：PluginContext.inject_message</text>

  <!-- Arrows per column -->
  <path d="M 244 310 L 244 340" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 244 450 L 244 480" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 244 590 L 244 620" class="arrow" marker-end="url(#arrow)"/>

  <path d="M 680 310 L 680 340" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 680 450 L 680 480" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 680 590 L 680 620" class="arrow" marker-end="url(#arrow)"/>

  <path d="M 1130 310 L 1130 340" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 1130 450 L 1130 480" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 1130 590 L 1130 620" class="arrow" marker-end="url(#arrow)"/>
</svg>


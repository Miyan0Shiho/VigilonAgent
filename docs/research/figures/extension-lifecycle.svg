<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <defs>
    <style>
      .title { font: 700 22px "Inter","Helvetica Neue",Arial,sans-serif; fill:#111; }
      .sub { font: 400 13px "Inter","Helvetica Neue",Arial,sans-serif; fill:#555; }
      .h { font: 700 14px "Inter","Helvetica Neue",Arial,sans-serif; fill:#111; }
      .t { font: 400 12px "Inter","Helvetica Neue",Arial,sans-serif; fill:#222; }
      .muted { font: 400 11px "Inter","Helvetica Neue",Arial,sans-serif; fill:#666; }
      .box { fill:#fff; stroke:#111; stroke-width:1.1; rx:12; }
      .lite { fill:#fff; stroke:#777; stroke-width:1.0; rx:12; }
      .accent { fill:#1565c0; }
      .arrow { stroke:#111; stroke-width:1.2; fill:none; }
      .arrowHead { fill:#111; }
      .grid { stroke:#eee; stroke-width:1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowHead"/>
    </marker>
  </defs>

  <text x="40" y="52" class="title">扩展生命周期对比：发现 → 加载 → 注册 → 治理 → 运行时装配</text>
  <text x="40" y="78" class="sub">Claude Code（MCP/skills/agents）· OpenClaw（manifest/plugin-sdk/contracts/runtime seam）· Hermes（registry/toolsets/plugins/MCP/skills hub）</text>

  <line x1="40" y1="110" x2="1360" y2="110" class="grid"/>
  <line x1="467" y1="110" x2="467" y2="800" class="grid"/>
  <line x1="893" y1="110" x2="893" y2="800" class="grid"/>

  <!-- Column headers -->
  <rect x="40" y="120" width="407" height="44" class="lite"/>
  <rect x="467" y="120" width="426" height="44" class="lite"/>
  <rect x="893" y="120" width="467" height="44" class="lite"/>
  <rect x="55" y="133" width="10" height="18" class="accent" rx="3"/>
  <text x="75" y="149" class="h">Claude Code</text>
  <rect x="482" y="133" width="10" height="18" class="accent" rx="3"/>
  <text x="502" y="149" class="h">OpenClaw</text>
  <rect x="908" y="133" width="10" height="18" class="accent" rx="3"/>
  <text x="928" y="149" class="h">Hermes Agent</text>

  <!-- Row labels -->
  <text x="40" y="230" class="h">① 发现/枚举</text>
  <text x="40" y="360" class="h">② 加载/连接</text>
  <text x="40" y="490" class="h">③ 注册/装配</text>
  <text x="40" y="620" class="h">④ 治理/边界</text>
  <text x="40" y="750" class="h">⑤ 更新/刷新</text>

  <!-- Claude -->
  <rect x="70" y="200" width="347" height="100" class="box"/>
  <text x="90" y="226" class="t">命令集合：local commands + MCP skills（过滤 prompt）</text>
  <text x="90" y="248" class="muted">SkillTool.getAllCommands（仅 loadedFrom='mcp' 的 skills）</text>

  <rect x="70" y="330" width="347" height="100" class="box"/>
  <text x="90" y="356" class="t">连接：agent/skill 可定义 MCP servers（引用或 inline）</text>
  <text x="90" y="378" class="muted">runAgent.initializeAgentMcpServers（connect + fetchTools + cleanup）</text>

  <rect x="70" y="460" width="347" height="100" class="box"/>
  <text x="90" y="486" class="t">装配：ToolUseContext 统一注入 tools/MCP/权限</text>
  <text x="90" y="508" class="muted">tools.ts + Tool.ts（refreshTools）</text>

  <rect x="70" y="590" width="347" height="100" class="box"/>
  <text x="90" y="616" class="t">治理：plugin-only customization 可锁定 MCP 面</text>
  <text x="90" y="638" class="muted">isRestrictedToPluginOnly('mcp') / isSourceAdminTrusted</text>

  <rect x="70" y="720" width="347" height="80" class="box"/>
  <text x="90" y="746" class="t">刷新：refreshTools + 远程 skill feature gate（conditional require）</text>

  <!-- OpenClaw -->
  <rect x="500" y="200" width="360" height="100" class="box"/>
  <text x="520" y="226" class="t">发现：discover + manifest registry（plugins + diagnostics）</text>
  <text x="520" y="248" class="muted">manifest-registry.ts：PluginManifestRecord</text>

  <rect x="500" y="330" width="360" height="100" class="box"/>
  <text x="520" y="356" class="t">加载：runtime registry loader 按 scope 装配</text>
  <text x="520" y="378" class="muted">ensurePluginRegistryLoaded（configured-channels/channels/all）</text>

  <rect x="500" y="460" width="360" height="100" class="box"/>
  <text x="520" y="486" class="t">装配：runtime seam 懒加载 agent/memory 等能力</text>
  <text x="520" y="508" class="muted">runtime-agent.ts / memory-runtime.ts</text>

  <rect x="500" y="590" width="360" height="100" class="box"/>
  <text x="520" y="616" class="t">治理：plugin-sdk/contracts 约束边界（隔离=可维护/可安全）</text>
  <text x="520" y="638" class="muted">AGENTS.md + plugins/contracts/*.test.ts</text>

  <rect x="500" y="720" width="360" height="80" class="box"/>
  <text x="520" y="746" class="t">刷新：manifest registry 短 TTL cache 折叠启动期 reload</text>

  <!-- Hermes -->
  <rect x="930" y="200" width="400" height="100" class="box"/>
  <text x="950" y="226" class="t">发现：built-in tools（import 自注册）+ plugins/entrypoints</text>
  <text x="950" y="248" class="muted">registry.discover_builtin_tools + plugins.py（ENTRY_POINTS_GROUP）</text>

  <rect x="930" y="330" width="400" height="100" class="box"/>
  <text x="950" y="356" class="t">连接：MCP stdio/HTTP（后台 loop + thread），可选依赖</text>
  <text x="950" y="378" class="muted">mcp_tool.py：safe env + credential stripping</text>

  <rect x="930" y="460" width="400" height="100" class="box"/>
  <text x="950" y="486" class="t">注册：PluginContext.register_tool → registry.register</text>
  <text x="950" y="508" class="muted">toolsets 门控决定“可行动作空间”</text>

  <rect x="930" y="590" width="400" height="100" class="box"/>
  <text x="950" y="616" class="t">治理：shadowing 拒绝 + skills_guard 扫描 + hub quarantine</text>
  <text x="950" y="638" class="muted">registry.py / skills_guard.py / skills_hub.py</text>

  <rect x="930" y="720" width="400" height="80" class="box"/>
  <text x="950" y="746" class="t">刷新：MCP list_changed → registry.deregister nuke-and-repave</text>

  <!-- Vertical arrows -->
  <path d="M 244 300 L 244 330" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 244 430 L 244 460" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 244 560 L 244 590" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 244 690 L 244 720" class="arrow" marker-end="url(#arrow)"/>

  <path d="M 680 300 L 680 330" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 680 430 L 680 460" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 680 560 L 680 590" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 680 690 L 680 720" class="arrow" marker-end="url(#arrow)"/>

  <path d="M 1130 300 L 1130 330" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 1130 430 L 1130 460" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 1130 560 L 1130 590" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 1130 690 L 1130 720" class="arrow" marker-end="url(#arrow)"/>
</svg>


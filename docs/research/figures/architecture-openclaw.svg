<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 22px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111; }
      .sub { font: 400 13px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #555; }
      .h { font: 700 13px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111; }
      .t { font: 400 12px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #222; }
      .muted { font: 400 11px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #666; }
      .box { fill: #fff; stroke: #111; stroke-width: 1.1; rx: 12; }
      .lite { fill: #fff; stroke: #777; stroke-width: 1.0; rx: 12; }
      .accent { fill: #1565c0; }
      .arrow { stroke: #111; stroke-width: 1.2; fill: none; }
      .arrowHead { fill: #111; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowHead"/>
    </marker>
  </defs>

  <text x="40" y="52" class="title">OpenClaw：规划/执行机制模块图（简化）</text>
  <text x="40" y="78" class="sub">关键证据：任务/flow、plugin-sdk/contracts、runtime-agent 懒加载、危险工具 denylist</text>

  <!-- Control plane -->
  <rect x="60" y="120" width="520" height="120" class="box"/>
  <rect x="78" y="138" width="12" height="18" class="accent" rx="3"/>
  <text x="100" y="154" class="h">控制面（Gateway / CLI / Channels）</text>
  <text x="100" y="178" class="t">src/cli/* · src/commands/* · src/channels/*</text>
  <text x="100" y="200" class="muted">定位：长期在线的个人助手控制面；对外暴露配置、通道、运行状态</text>

  <!-- Plugin boundary -->
  <rect x="620" y="120" width="520" height="120" class="box"/>
  <rect x="638" y="138" width="12" height="18" class="accent" rx="3"/>
  <text x="660" y="154" class="h">扩展边界（plugin-sdk + contracts）</text>
  <text x="660" y="178" class="t">src/plugin-sdk/* · src/plugins/contracts/* · AGENTS.md</text>
  <text x="660" y="200" class="muted">原则：core 扩展无关；插件只能通过 SDK 合同进入 core</text>

  <!-- Runtime injection -->
  <rect x="620" y="280" width="520" height="120" class="lite"/>
  <text x="640" y="306" class="h">Runtime Seam（懒加载注入能力）</text>
  <text x="640" y="330" class="t">src/plugins/runtime/* · runtime-agent.ts</text>
  <text x="640" y="352" class="muted">agent 能力 / provider / channel / memory 等以 runtime 方式装配</text>

  <!-- Task system -->
  <rect x="60" y="280" width="520" height="200" class="box"/>
  <rect x="78" y="298" width="12" height="18" class="accent" rx="3"/>
  <text x="100" y="314" class="h">任务系统（执行单元 = TaskRecord + Flow）</text>
  <text x="100" y="338" class="t">tasks/task-executor.ts · tasks/task-registry.ts</text>
  <text x="100" y="360" class="muted">特性：queued/running/terminal 生命周期 + flow（取消/投递/去重/观察者事件）</text>
  <text x="100" y="382" class="muted">用于：后台执行、跨通道通知、可审计执行轨迹</text>

  <!-- Security -->
  <rect x="60" y="520" width="520" height="120" class="lite"/>
  <text x="80" y="546" class="h">安全与风险边界</text>
  <text x="80" y="570" class="t">security/dangerous-tools.ts · security/audit.ts</text>
  <text x="80" y="592" class="muted">对 HTTP surface 默认 deny 高风险工具（RCE/文件破坏/会话编排）</text>

  <!-- Plan payload -->
  <rect x="620" y="520" width="520" height="120" class="lite"/>
  <text x="640" y="546" class="h">“规划”的结构化表征</text>
  <text x="640" y="570" class="t">test-utils/system-run-prepare-payload.ts（payload.plan）</text>
  <text x="640" y="592" class="muted">强调可审计执行意图（argv/cwd/preview），不一定统一 Plan Mode</text>

  <!-- Memory -->
  <rect x="60" y="670" width="1080" height="70" class="lite"/>
  <text x="80" y="698" class="h">记忆（作为插件 runtime 能力）</text>
  <text x="80" y="722" class="t">plugins/memory-runtime.ts（按需加载 memory runtime / search manager）</text>

  <!-- Arrows -->
  <path d="M 580 180 L 620 180" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 880 240 L 880 280" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 320 240 L 320 280" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 320 480 L 320 520" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 880 400 L 880 520" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 320 640 L 320 670" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 880 640 L 880 670" class="arrow" marker-end="url(#arrow)"/>
</svg>


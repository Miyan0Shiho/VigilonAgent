<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title { font: 700 22px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 13px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #444; }
      .colTitle { font: 700 16px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111; }
      .label { font: 600 12px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111; }
      .text { font: 400 12px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #222; }
      .muted { font: 400 11px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #666; }
      .box { fill: #fff; stroke: #111; stroke-width: 1.1; rx: 10; }
      .boxLite { fill: #fff; stroke: #777; stroke-width: 1; rx: 10; }
      .accent { fill: #1565c0; }
      .accentStroke { stroke: #1565c0; }
      .arrow { stroke: #111; stroke-width: 1.2; fill: none; }
      .arrowHead { fill: #111; }
      .grid { stroke: #eee; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowHead"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="48" class="title">规划 → 工具选择 → 执行 → 回填：三项目闭环对比（聚焦 Agent 规划/执行机制）</text>
  <text x="40" y="74" class="subtitle">Claude Code / OpenClaw / Hermes Agent · 输出为示意性时序/流水对齐（以源码证据为准）</text>

  <!-- Column guides -->
  <line x1="40" y1="110" x2="1360" y2="110" class="grid"/>
  <line x1="467" y1="110" x2="467" y2="790" class="grid"/>
  <line x1="893" y1="110" x2="893" y2="790" class="grid"/>

  <!-- Column titles -->
  <rect x="40" y="120" width="407" height="44" class="boxLite"/>
  <rect x="467" y="120" width="426" height="44" class="boxLite"/>
  <rect x="893" y="120" width="467" height="44" class="boxLite"/>
  <rect x="55" y="133" width="10" height="18" class="accent" rx="3"/>
  <text x="75" y="149" class="colTitle">Claude Code（Plan Mode 强 gate）</text>
  <rect x="482" y="133" width="10" height="18" class="accent" rx="3"/>
  <text x="502" y="149" class="colTitle">OpenClaw（平台化：控制面 + 插件 + 任务/flow）</text>
  <rect x="908" y="133" width="10" height="18" class="accent" rx="3"/>
  <text x="928" y="149" class="colTitle">Hermes Agent（toolset 门控 + 并行 tool_calls）</text>

  <!-- Shared step labels (left margin) -->
  <text x="40" y="220" class="label">① 规划表示</text>
  <text x="40" y="340" class="label">② 工具面/能力注入</text>
  <text x="40" y="460" class="label">③ 执行控制</text>
  <text x="40" y="580" class="label">④ 结果回填/可观测</text>
  <text x="40" y="720" class="label">⑤ 扩展与长期演进</text>

  <!-- Claude column boxes -->
  <rect x="70" y="190" width="347" height="86" class="box"/>
  <text x="90" y="216" class="text">Plan Mode：EnterPlanMode → 写 plan 文件 → ExitPlanMode 请求审批</text>
  <text x="90" y="238" class="muted">计划可从 transcript/附件恢复（跨压缩边界）</text>

  <rect x="70" y="310" width="347" height="86" class="box"/>
  <text x="90" y="336" class="text">ToolUseContext：tools + MCP + 权限上下文 + 状态更新统一注入</text>
  <text x="90" y="358" class="muted">tools.ts 组装工具；MCP 动态扩展</text>

  <rect x="70" y="430" width="347" height="86" class="box"/>
  <text x="90" y="456" class="text">执行面：Bash/File 等高风险工具 → 权限/只读/安全校验</text>
  <text x="90" y="478" class="muted">审批 UI 与权限模式切换耦合</text>

  <rect x="70" y="550" width="347" height="98" class="box"/>
  <text x="90" y="576" class="text">任务/后台：Task 状态机 + RemoteAgentTask（含 plan 审批等待）</text>
  <text x="90" y="598" class="muted">进度/成本/UI 组件提供可观测</text>

  <rect x="70" y="692" width="347" height="78" class="box"/>
  <text x="90" y="718" class="text">扩展：Agents/Skills/MCP 一体化；流程协议通过 prompt 固化</text>

  <!-- OpenClaw column boxes -->
  <rect x="500" y="190" width="360" height="86" class="box"/>
  <text x="520" y="216" class="text">规划更多是结构化 payload（例如 system.run 的 payload.plan）</text>
  <text x="520" y="238" class="muted">强调可审计“执行意图”，不一定统一 Plan Mode</text>

  <rect x="500" y="310" width="360" height="86" class="box"/>
  <text x="520" y="336" class="text">插件体系：manifest-first + plugin-sdk/contracts 约束扩展边界</text>
  <text x="520" y="358" class="muted">runtime seam 懒加载注入能力</text>

  <rect x="500" y="430" width="360" height="86" class="box"/>
  <text x="520" y="456" class="text">执行安全：HTTP surface 默认 deny 高风险工具（RCE/文件破坏/会话编排）</text>
  <text x="520" y="478" class="muted">安全审计覆盖多类控制面风险</text>

  <rect x="500" y="550" width="360" height="98" class="box"/>
  <text x="520" y="576" class="text">任务系统：TaskRecord + Flow（取消/投递/去重/观察者事件）</text>
  <text x="520" y="598" class="muted">TUI + transcript 辅助复盘</text>

  <rect x="500" y="692" width="360" height="78" class="box"/>
  <text x="520" y="718" class="text">长期演进：契约测试守护插件边界；平台化通道/提供方可扩展</text>

  <!-- Hermes column boxes -->
  <rect x="930" y="190" width="400" height="86" class="box"/>
  <text x="950" y="216" class="text">规划常用 todo 工具表达；toolset 过滤决定“可行动作空间”</text>
  <text x="950" y="238" class="muted">更多是“软 gate”：策略/审批/hook 共同约束</text>

  <rect x="930" y="310" width="400" height="86" class="box"/>
  <text x="950" y="336" class="text">工具系统：tools/registry.py 自注册；MCP 工具可动态刷新</text>
  <text x="950" y="358" class="muted">toolsets.py 组合工具集（safe/debugging/hermes-acp…）</text>

  <rect x="930" y="430" width="400" height="86" class="box"/>
  <text x="950" y="456" class="text">执行控制：支持 interrupt；并行 tool_calls（线程池）+ checkpoint + 心跳</text>
  <text x="950" y="478" class="muted">写文件/patch/破坏性命令前做 checkpoint</text>

  <rect x="930" y="550" width="400" height="98" class="box"/>
  <text x="950" y="576" class="text">回填：执行结果按 tool_call 顺序追加到 messages；verbose/回调提供观测</text>
  <text x="950" y="598" class="muted">memory/session_search 支持跨会话知识复用</text>

  <rect x="930" y="692" width="400" height="78" class="box"/>
  <text x="950" y="718" class="text">扩展：skills 自生成/自改进；delegate_task 委派 subagent 并行工作流</text>

  <!-- Flow arrows within each column -->
  <path d="M 244 276 L 244 310" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 244 396 L 244 430" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 244 516 L 244 550" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 244 648 L 244 692" class="arrow" marker-end="url(#arrow)"/>

  <path d="M 680 276 L 680 310" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 680 396 L 680 430" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 680 516 L 680 550" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 680 648 L 680 692" class="arrow" marker-end="url(#arrow)"/>

  <path d="M 1130 276 L 1130 310" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 1130 396 L 1130 430" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 1130 516 L 1130 550" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 1130 648 L 1130 692" class="arrow" marker-end="url(#arrow)"/>
</svg>


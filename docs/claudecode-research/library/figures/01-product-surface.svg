<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 01: Claude Code Product Surface</text>
  
  <!-- CLI Layer -->
  <rect x="100" y="80" width="600" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="115" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">CLI Surface (Terminal / TUI)</text>
  
  <!-- Core Components -->
  <rect x="100" y="180" width="180" height="100" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="190" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Subagents / Tasks</text>
  
  <rect x="310" y="180" width="180" height="100" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">MCP Registry</text>
  
  <rect x="520" y="180" width="180" height="100" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="610" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Extension Skills</text>
  
  <!-- Connections -->
  <line x1="190" y1="140" x2="190" y2="180" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="140" x2="400" y2="180" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="140" x2="610" y2="180" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Infrastructure -->
  <rect x="100" y="320" width="600" height="50" rx="5" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="400" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Runtime Kernel (QueryEngine / queryLoop)</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 05: Process User Input Flow</text>
  
  <!-- User Input -->
  <rect x="50" y="80" width="150" height="50" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="125" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Raw User Input</text>
  
  <line x1="200" y1="105" x2="250" y2="105" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Preprocessing -->
  <rect x="250" y="80" width="200" height="50" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">processUserInput()</text>
  
  <!-- Classification -->
  <polygon points="550,80 650,105 550,130 450,105" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="550" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">Type?</text>
  
  <line x1="450" y1="105" x2="500" y2="105" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Paths -->
  <path d="M 650 105 L 700 105 L 700 180 L 650 180" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="710" y="145" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" transform="rotate(90, 710, 145)">Slash Command</text>
  
  <rect x="450" y="160" width="200" height="40" rx="5" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="550" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">Execute Slash Handler</text>
  
  <line x1="550" y1="130" x2="550" y2="240" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="560" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">Natural Language</text>
  
  <rect x="450" y="240" width="200" height="50" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="550" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">QueryEngine.submit()</text>
  
  <!-- Attachments -->
  <rect x="50" y="240" width="150" height="50" rx="5" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="125" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">File Attachments</text>
  
  <line x1="200" y1="265" x2="450" y2="265" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>

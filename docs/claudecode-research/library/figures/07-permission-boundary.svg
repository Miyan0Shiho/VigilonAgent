<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 07: Permission &amp; Policy Boundary</text>
  
  <!-- Tool Execution -->
  <rect x="50" y="150" width="180" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="140" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Tool Execution Request</text>
  
  <line x1="230" y1="180" x2="300" y2="180" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Permission Check -->
  <polygon points="400,130 500,180 400,230 300,180" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">canUseTool()</text>
  
  <!-- Policies -->
  <g transform="translate(325, 260)">
    <rect x="0" y="0" width="150" height="80" rx="5" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="75" y="25" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Policy Engine</text>
    <text x="10" y="45" font-family="Arial, Helvetica, sans-serif" font-size="10">isPolicyAllowed()</text>
    <text x="10" y="60" font-family="Arial, Helvetica, sans-serif" font-size="10">Enterprise Limits</text>
  </g>
  
  <line x1="400" y1="230" x2="400" y2="260" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Result Paths -->
  <line x1="500" y1="180" x2="600" y2="180" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="550" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">Allowed</text>
  
  <rect x="600" y="155" width="150" height="50" rx="5" fill="#009E73" fill-opacity="0.1" stroke="#009E73" stroke-width="1.5"/>
  <text x="675" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#009E73">EXECUTE</text>
  
  <path d="M 400 130 L 400 80 L 600 80" fill="none" stroke="#D55E00" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="500" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">Denied</text>
  
  <rect x="600" y="55" width="150" height="50" rx="5" fill="#D55E00" fill-opacity="0.1" stroke="#D55E00" stroke-width="1.5"/>
  <text x="675" y="85" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#D55E00">BLOCK / ABORT</text>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>

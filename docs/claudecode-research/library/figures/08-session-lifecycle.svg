<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 08: Session Lifecycle &amp; Persistence</text>
  
  <!-- Lifecycle Stages -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="60" y="35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BOOTSTRAP</text>
  </g>
  
  <g transform="translate(220, 100)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="60" y="35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ACTIVE</text>
  </g>
  
  <g transform="translate(390, 100)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="60" y="35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SUSPEND</text>
  </g>
  
  <g transform="translate(560, 100)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="60" y="35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RESUME</text>
  </g>
  
  <!-- Transitions -->
  <line x1="170" y1="130" x2="220" y2="130" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="130" x2="390" y2="130" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="130" x2="560" y2="130" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <path d="M 620 160 L 620 220 L 280 220 L 280 160" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Persistence Layer -->
  <rect x="50" y="280" width="700" height="80" rx="10" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="10,5"/>
  <text x="400" y="310" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">~/.claude/sessions/ (Persistence)</text>
  <text x="400" y="335" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">JSON Transcript | Tool Artifacts | Content Replacements</text>
  
  <!-- Persistence Arrows -->
  <line x1="110" y1="160" x2="110" y2="280" stroke="#000000" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="280" x2="280" y2="220" stroke="#000000" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="160" x2="450" y2="280" stroke="#000000" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="280" x2="620" y2="160" stroke="#000000" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>
